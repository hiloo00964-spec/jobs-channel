name: Jobs Auto Bot
on:
  schedule:
    - cron: '0 6-20 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          TOKNBOT: ${{ secrets.TOKNBOT }}
          GMY: ${{ secrets.GMY }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          MY_CHANNEL_LINK: ${{ secrets.MY_CHANNEL_LINK }}
        # هذا الأمر سيبحث عن مكان الملف الحقيقي ويشغله فوراً
        run: |
          SCRIPT_PATH=$(find . -name "script.py" -print -quit)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ Error: script.py not found anywhere in the repo!"
            exit 1
          fi
          echo "🚀 Found script at: $SCRIPT_PATH"
          python "$SCRIPT_PATH"

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_history.txt || echo "No history file to add"
          git commit -m "Update job history" && git push || echo "No changes to commit"
